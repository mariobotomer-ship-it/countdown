<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>צחי: ההחלטה - כן!!!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0a0a0a;
    color: #fff;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    overflow: hidden;
    position: relative;
  }
  canvas#fireworks {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }
  .content {
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 0.5em;
  }
  .blink-text {
    font-size: clamp(1.5rem, 5vw, 3rem);
    font-weight: 900;
    animation: rainbow 1.5s linear infinite, blink 0.5s step-end infinite, shake 0.3s infinite;
    text-shadow: 0 0 20px #ff0, 0 0 40px #f0f, 0 0 60px #0ff;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  @keyframes rainbow {
    0% { color: #ff0000; }
    16% { color: #ff8800; }
    33% { color: #ffff00; }
    50% { color: #00ff00; }
    66% { color: #0088ff; }
    83% { color: #ff00ff; }
    100% { color: #ff0000; }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px) rotate(-2deg); }
    75% { transform: translateX(5px) rotate(2deg); }
  }
  h1 {
    font-size: clamp(2.5rem, 8vw, 6rem);
    margin: 0.2em 0;
    animation: rainbow 2s linear infinite, pulse 0.8s ease-in-out infinite;
    text-shadow: 0 0 30px rgba(255,255,0,0.8), 0 0 60px rgba(255,0,255,0.5);
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  .decision {
    font-size: clamp(4rem, 15vw, 12rem);
    font-weight: 900;
    color: #00ff88;
    text-shadow: 0 0 40px #00ff88, 0 0 80px #00ff88, 0 0 120px #00ff88;
    animation: megaPulse 0.6s ease-in-out infinite, glow 1s ease-in-out infinite alternate;
    letter-spacing: 0.1em;
  }
  @keyframes megaPulse {
    0%, 100% { transform: scale(1) rotate(0deg); }
    25% { transform: scale(1.1) rotate(-2deg); }
    75% { transform: scale(1.05) rotate(2deg); }
  }
  @keyframes glow {
    from { text-shadow: 0 0 40px #00ff88, 0 0 80px #00ff88; }
    to { text-shadow: 0 0 60px #ffff00, 0 0 120px #ff00ff, 0 0 180px #00ffff; }
  }
  .subtitle {
    font-size: clamp(1.2rem, 4vw, 2.5rem);
    color: #ffd700;
    animation: rainbow 3s linear infinite;
    text-shadow: 0 0 15px rgba(255,215,0,0.6);
  }
  .party-emoji {
    font-size: clamp(2rem, 6vw, 4rem);
    animation: spin 1s linear infinite;
    display: inline-block;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .floating-emoji {
    position: fixed;
    font-size: 2rem;
    pointer-events: none;
    z-index: 1;
    animation: floatUp linear forwards;
  }
  @keyframes floatUp {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-100px) rotate(720deg); opacity: 0; }
  }
  .confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    z-index: 1;
    pointer-events: none;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(1080deg); opacity: 0; }
  }
</style>
</head>
<body>
<canvas id="fireworks"></canvas>

<div class="content">
  <div class="blink-text">בוקר טוב יא בני זונות!</div>
  <h1>צחי: ההחלטה</h1>
  <div class="decision">
    <span class="party-emoji">🎉</span>
    כן!!!
    <span class="party-emoji">🎉</span>
  </div>
  <div class="subtitle">נצטרף במלוא ההדר 🚀🔥💥</div>
  <div style="font-size:clamp(1rem,3vw,1.5rem);color:#aaa;margin-top:0.5em;">
    <span class="party-emoji">🥳</span>
    <span class="party-emoji">🍾</span>
    <span class="party-emoji">🪩</span>
    <span class="party-emoji">🏆</span>
    <span class="party-emoji">💎</span>
  </div>
</div>

<script>
// === FIREWORKS on canvas ===
const canvas = document.getElementById('fireworks');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

const particles = [];
const colors = ['#ff0044','#ffdd00','#00ff88','#0088ff','#ff00ff','#ff8800','#00ffff','#ffffff'];

function explode(x, y) {
  const count = 60 + Math.random() * 60;
  const color = colors[Math.floor(Math.random() * colors.length)];
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 60 + Math.random() * 40,
      maxLife: 100,
      color,
      size: 1.5 + Math.random() * 2.5,
      trail: []
    });
  }
}

function launchFirework() {
  const x = Math.random() * W;
  const y = H * 0.1 + Math.random() * H * 0.5;
  explode(x, y);
}

setInterval(launchFirework, 300);
setTimeout(() => setInterval(launchFirework, 500), 150);

function animate() {
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(10,10,10,0.15)';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.04;
    p.vx *= 0.99;
    p.life--;
    const alpha = p.life / p.maxLife;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
    ctx.fillStyle = p.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
    ctx.fill();
    if (p.life <= 0) particles.splice(i, 1);
  }
  requestAnimationFrame(animate);
}
animate();

// === Floating emojis ===
const emojis = ['🎉','🥳','🍾','🔥','💥','⭐','🌟','✨','🎊','🪩','🏆','💎','🚀','❤️‍🔥','👑'];
function spawnEmoji() {
  const el = document.createElement('div');
  el.className = 'floating-emoji';
  el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
  el.style.left = Math.random() * 100 + '%';
  el.style.fontSize = (1.5 + Math.random() * 2.5) + 'rem';
  const dur = 3 + Math.random() * 4;
  el.style.animationDuration = dur + 's';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), dur * 1000);
}
setInterval(spawnEmoji, 400);

// === Confetti ===
const confettiColors = ['#ff0044','#ffdd00','#00ff88','#0088ff','#ff00ff','#ff8800'];
function spawnConfetti() {
  const el = document.createElement('div');
  el.className = 'confetti';
  el.style.left = Math.random() * 100 + '%';
  el.style.background = confettiColors[Math.floor(Math.random() * confettiColors.length)];
  el.style.width = (5 + Math.random() * 10) + 'px';
  el.style.height = (5 + Math.random() * 10) + 'px';
  el.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
  const dur = 2 + Math.random() * 3;
  el.style.animationDuration = dur + 's';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), dur * 1000);
}
setInterval(spawnConfetti, 150);
</script>
</body>
</html>
