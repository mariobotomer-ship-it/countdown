<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>צחי: ההחלטה</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0a0a0a;
    color: #fff;
    font-family: 'Segoe UI', Tahoma, sans-serif;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 4rem);
    margin-bottom: 0.5em;
    text-align: center;
  }
  .subtitle {
    font-size: clamp(1rem, 3vw, 1.5rem);
    color: #aaa;
    margin-bottom: 2em;
  }
  .timer {
    display: flex;
    gap: 1.5rem;
    direction: ltr;
  }
  .timer .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .timer .num {
    font-size: clamp(3rem, 10vw, 7rem);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .timer .label {
    font-size: clamp(0.8rem, 2vw, 1.2rem);
    color: #888;
    margin-top: 0.3em;
  }
  .timer .sep {
    font-size: clamp(3rem, 10vw, 7rem);
    font-weight: 300;
    color: #444;
    line-height: 1;
  }
  .done h1 { color: #e74c3c; }
</style>
</head>
<body>
  <h1>צחי: ההחלטה</h1>
  <div class="subtitle">(בלי לחץ)</div>
  <div class="timer" id="timer">
    <div class="unit"><span class="num" id="h">00</span><span class="label">שעות</span></div>
    <div class="sep">:</div>
    <div class="unit"><span class="num" id="m">00</span><span class="label">דקות</span></div>
    <div class="sep">:</div>
    <div class="unit"><span class="num" id="s">00</span><span class="label">שניות</span></div>
  </div>
<script>
function update() {
  const now = new Date();
  const midnight = new Date(now);
  midnight.setHours(24, 0, 0, 0);
  let diff = Math.max(0, Math.floor((midnight - now) / 1000));
  const h = String(Math.floor(diff / 3600)).padStart(2, '0');
  const m = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
  const s = String(diff % 60).padStart(2, '0');
  document.getElementById('h').textContent = h;
  document.getElementById('m').textContent = m;
  document.getElementById('s').textContent = s;
  if (diff === 0) document.body.classList.add('done');
}
update();
setInterval(update, 1000);
</script>
</body>
</html>
